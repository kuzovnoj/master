services:
  kuzmaster:
    build: ./kuzmaster
    image: kuzmaster
    container_name: kuzmaster_app
    restart: always
    user: "0:0"
    command: "gunicorn -c gunicorn.py kuzmaster.wsgi"
    env_file:
      - .env
    networks:
      - shared_net
    ports:
      - "8003:8000"
    volumes:
      - ./kuzmaster:/app/www/kuzmaster

networks:
  shared_net:
    external: true

